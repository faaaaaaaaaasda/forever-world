name: Build ForeverOrigins
 
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      # JDK 21 also compiles Java 17 targets, so this works for 1.20.x and 1.21.x Paper
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
 
      - name: Build with Maven
        run: mvn -B clean package
 
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: ForeverOrigins
          path: target/ForeverOrigins.jar
          if-no-files-found: error
 
      # Only when you push a tag like v1.0.1
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/ForeverOrigins.jar
 
